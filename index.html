/* --------------------------------------------------
   READ TEXT FROM A NORMAL PDF
-------------------------------------------------- */

async function readFirstPage(file) {

  try {

    const arrayBuffer = await file.arrayBuffer();

    const pdf = await pdfjsLib.getDocument({
      data: arrayBuffer
    }).promise;

    const page = await pdf.getPage(1);

    const textContent = await page.getTextContent();

    const text = textContent.items
      .map(item => item.str)
      .join(" ");

    return text;

  } catch (error) {

    console.error("PDF text extraction error:", error);

    return "";

  }

}


/* --------------------------------------------------
   OCR FALLBACK FOR SCANNED PDFs
-------------------------------------------------- */

async function readFirstPageWithOCR(file) {

  try {

    const arrayBuffer = await file.arrayBuffer();

    const pdf = await pdfjsLib.getDocument({
      data: arrayBuffer
    }).promise;

    const page = await pdf.getPage(1);

    const viewport = page.getViewport({
      scale: 2
    });

    const canvas = document.createElement("canvas");

    const context = canvas.getContext("2d");

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({
      canvasContext: context,
      viewport: viewport
    }).promise;

    const result = await Tesseract.recognize(
      canvas,
      "eng"
    );

    return result.data.text;

  } catch (error) {

    console.error("OCR error:", error);

    return "";

  }

}


/* --------------------------------------------------
   EXTRACT COURT ONLINE FILING DATE
-------------------------------------------------- */

function extractFilingDate(firstPageText) {

  const datePattern =
    /(?:on|dated)\s+(\d{1,2}\/\d{1,2}\/\d{4})(?:\s+at\s+(\d{1,2}:\d{2}(?::\d{2})?\s*(?:AM|PM)?))?/i;

  const match =
    firstPageText.match(datePattern);

  if (!match) {

    return null;

  }

  const dateParts =
    match[1].split("/");

  const day =
    dateParts[0].padStart(2, "0");

  const month =
    dateParts[1].padStart(2, "0");

  const year =
    dateParts[2];

  return {

    date: `${year}-${month}-${day}`,

    time: match[2] || ""

  };

}

/* --------------------------------------------------
   CASELINES MAPPING LOGIC
-------------------------------------------------- */

function getCaseLinesSection(courtOnlineType) {

  /* FIRST: supplied ambiguous mappings */

  if (suppliedCaseLinesMapping[courtOnlineType]) {

    return {
      section: suppliedCaseLinesMapping[courtOnlineType],
      status: "Provisional - Review Required"
    };

  }


  /* SECOND: explicit mappings */

  if (caseLinesMapping[courtOnlineType]) {

    return {
      section: caseLinesMapping[courtOnlineType],
      status: "Confirmed"
    };

  }


  /* THIRD: provisional matching */

  const provisional =
    findProvisionalCaseLinesSection(
      courtOnlineType
    );

  if (provisional) {

    return {
      section: provisional,
      status: "Provisional - Review Required"
    };

  }


  return {
    section: "048 - Any other interlocutory Application",
    status: "Provisional - Review Required"
  };

}


function findProvisionalCaseLinesSection(courtOnlineType) {

  const type =
    courtOnlineType.toLowerCase();


  if (type.includes("application")) {

    return "048 - Any other interlocutory Application";

  }


  if (type.includes("notice")) {

    return "044 - Notice of Set-Down";

  }


  if (type.includes("affidavit")) {

    return "001 - Notice of Motion with Founding Affidavit";

  }


  if (type.includes("report")) {

    return "033 - Expert Reports";

  }


  return null;

}


/* --------------------------------------------------
   NORMALISE TEXT
-------------------------------------------------- */

function normaliseText(value) {

  return value
    .toLowerCase()
    .replace(/[’‘]/g, "'")
    .replace(/[–—-]/g, " ")
    .replace(/\s+/g, " ")
    .trim();

}


/* --------------------------------------------------
   IDENTIFY COURT ONLINE TYPE
-------------------------------------------------- */

function identifyCourtOnlineType(firstPageText) {

  const normalisedText =
    normaliseText(firstPageText);

  const sortedTypes =
    [...courtOnlineTypes].sort(
      (a, b) => b.length - a.length
    );


  for (const documentType of sortedTypes) {

    const normalisedType =
      normaliseText(documentType);

    if (
      normalisedText.includes(normalisedType)
    ) {

      return documentType;

    }

  }


  return null;

}


/* --------------------------------------------------
   PROCESS DOCUMENTS
-------------------------------------------------- */

processButton.addEventListener("click", async function () {

  const files = fileUpload.files;

  if (!files || files.length === 0) {

    return;

  }


  processButton.textContent =
    "Processing Documents...";

  processButton.disabled = true;

  results.innerHTML =
    "<h2>Processing Results</h2>";


  const processedDocuments = [];


  /* -----------------------------------------------
     READ AND CLASSIFY EVERY DOCUMENT
  ----------------------------------------------- */

  for (let i = 0; i < files.length; i++) {

    const originalName =
      files[i].name;


    let firstPageText =
      await readFirstPage(files[i]);


    if (
      !firstPageText ||
      firstPageText.trim().length < 10
    ) {

      firstPageText =
        await readFirstPageWithOCR(files[i]);

    }


    /* Identify Court Online type */

    const identifiedAs =
      identifyCourtOnlineType(firstPageText);


    /* Extract filing date */

    const filingInfo =
      extractFilingDate(firstPageText);


    /* Determine CaseLines destination */

    const mapping =
      identifiedAs
        ? getCaseLinesSection(identifiedAs)
        : {
            section:
              "048 - Any other interlocutory Application",

            status:
              "Provisional - Review Required"
          };


    processedDocuments.push({

      originalName:
        originalName,

      identifiedAs:
        identifiedAs || "Review Required",

      filingDate:
        filingInfo
          ? filingInfo.date
          : null,

      filingTime:
        filingInfo
          ? filingInfo.time
          : "",

      section:
        mapping.section,

      status:
        mapping.status

    });

  }


  /* -----------------------------------------------
     SORT BY FILING DATE
     OLDEST → NEWEST
  ----------------------------------------------- */

  processedDocuments.sort(function (a, b) {

    if (!a.filingDate && !b.filingDate) {
      return 0;
    }

    if (!a.filingDate) {
      return 1;
    }

    if (!b.filingDate) {
      return -1;
    }

    return a.filingDate.localeCompare(
      b.filingDate
    );

  });


  /* -----------------------------------------------
     DISPLAY RESULTS
  ----------------------------------------------- */

  results.innerHTML =
    "<h2>Processing Results</h2>";


  processedDocuments.forEach(function (document) {

    const item =
      document.createElement("div");

    item.className =
      "result-item";


    item.innerHTML = `

      <div class="result-name">

        ${document.originalName}

      </div>

      <div class="result-status">

        <strong>Identified as:</strong>
        ${document.identifiedAs}

        <br><br>

        <strong>Filing date:</strong>

        ${
          document.filingDate
            ? document.filingDate
            : "⚠ Date not found"
        }

        <br>

        <strong>Filing time:</strong>

        ${
          document.filingTime ||
          "Not found"
        }

        <br><br>

        <strong>CaseLines section:</strong>

        <br>

        ${document.section}

        <br><br>

        <strong>Status:</strong>

        ${document.status}

      </div>

    `;


    results.appendChild(item);

  });


  processButton.textContent =
    "Documents Processed";


  fileCount.textContent =
    files.length +
    " document(s) processed. Please review the results.";

});

</script>
</body>
</html>
