/* =========================================================
   TEXT NORMALISATION
========================================================= */

function normaliseText(value) {

  return String(value || "")
    .toLowerCase()
    .replace(/[’‘]/g, "'")
    .replace(/[–—-]/g, " ")
    .replace(/\s+/g, " ")
    .trim();

}


/* =========================================================
   IDENTIFY COURT ONLINE DOCUMENT TYPE
   IMPORTANT:
   Court Online places the document type between tramlines
   on the first page.

   Example:

   | Notice of Motion |

   The function below looks specifically for text between
   vertical bars/tramlines before considering anything else.
========================================================= */

function identifyCourtOnlineType(firstPageText) {

  if (!firstPageText) {
    return null;
  }


  /*
    First attempt:
    Find text between vertical bars.

    This handles examples such as:

    | Notice of Motion |

    | Affidavit |

    | Application for Summary Judgment |

  */

  const tramlineMatches =
    firstPageText.match(/\|([^|]{2,200})\|/g);


  if (tramlineMatches) {

    const sortedTypes =
      [...courtOnlineTypes].sort(
        (a, b) => b.length - a.length
      );


    for (const match of tramlineMatches) {

      /*
        Remove the tramlines.
      */

      const textBetweenTramlines =
        match
          .replace(/^\|/, "")
          .replace(/\|$/, "")
          .trim();


      const normalisedTramlineText =
        normaliseText(
          textBetweenTramlines
        );


      /*
        Look for an exact Court Online document type
        inside the tramline text.
      */

      for (const documentType of sortedTypes) {

        const normalisedType =
          normaliseText(documentType);


        if (
          normalisedTramlineText ===
          normalisedType
        ) {

          return documentType;

        }

      }


      /*
        Some PDF text extraction may put additional
        whitespace or formatting inside the tramlines.

        Therefore also allow the known document type
        to occur within the tramline text.
      */

      for (const documentType of sortedTypes) {

        const normalisedType =
          normaliseText(documentType);


        if (
          normalisedTramlineText.includes(
            normalisedType
          )
        ) {

          return documentType;

        }

      }

    }

  }


  /*
    SECONDARY FALLBACK

    If PDF.js does not preserve the tramlines as literal
    "|" characters, we retain the old whole-page search.

    This means the application will still work with PDFs
    where the vertical tramlines are represented differently
    by the PDF text layer.
  */

  const normalisedText =
    normaliseText(firstPageText);


  const sortedTypes =
    [...courtOnlineTypes].sort(
      (a, b) => b.length - a.length
    );


  for (const documentType of sortedTypes) {

    const normalisedType =
      normaliseText(documentType);


    if (
      normalisedText.includes(
        normalisedType
      )
    ) {

      return documentType;

    }

  }


  return null;

}


/* =========================================================
   EXTRACT FILING DATE
========================================================= */

function extractFilingDate(firstPageText) {

  if (!firstPageText) {
    return null;
  }


  /*
    Court Online example:

    filed electronically by the Registrar on
    24/6/2025 at 8:13:20 AM
  */

  const datePattern =
    /(?:on|dated)\s+(\d{1,2}\/\d{1,2}\/\d{4})(?:\s+at\s+(\d{1,2}:\d{2}(?::\d{2})?\s*(?:AM|PM)?))?/i;


  const match =
    firstPageText.match(datePattern);


  if (!match) {

    /*
      Fallback:
      look for a standalone date.
    */

    const fallback =
      firstPageText.match(
        /\b(\d{1,2}\/\d{1,2}\/\d{4})\b/
      );


    if (!fallback) {
      return null;
    }


    const parts =
      fallback[1].split("/");


    return {

      date:
        `${parts[2]}-${parts[1].padStart(2, "0")}-${parts[0].padStart(2, "0")}`,

      time: ""

    };

  }


  const dateParts =
    match[1].split("/");


  const day =
    dateParts[0].padStart(2, "0");


  const month =
    dateParts[1].padStart(2, "0");


  const year =
    dateParts[2];


  return {

    date:
      `${year}-${month}-${day}`,

    time:
      match[2] || ""

  };

}


/* =========================================================
   READ FIRST PAGE — NORMAL PDF TEXT
========================================================= */

async function readFirstPage(file) {

  try {

    const arrayBuffer =
      await file.arrayBuffer();


    const pdf =
      await pdfjsLib.getDocument({
        data: arrayBuffer
      }).promise;


    const page =
      await pdf.getPage(1);


    const textContent =
      await page.getTextContent();


    const text =
      textContent.items
        .map(item => item.str)
        .join(" ");


    return text;

  } catch (error) {

    console.error(
      "PDF text extraction error:",
      file.name,
      error
    );


    return "";

  }

}


/* =========================================================
   OCR — WITH TIMEOUT
========================================================= */

async function readFirstPageWithOCR(file) {

  const OCR_TIMEOUT = 30000;


  try {

    const ocrPromise = (async () => {

      const arrayBuffer =
        await file.arrayBuffer();


      const pdf =
        await pdfjsLib.getDocument({
          data: arrayBuffer
        }).promise;


      const page =
        await pdf.getPage(1);


      const viewport =
        page.getViewport({
          scale: 1.5
        });


      const canvas =
        document.createElement("canvas");


      const context =
        canvas.getContext("2d");


      canvas.width =
        Math.ceil(viewport.width);


      canvas.height =
        Math.ceil(viewport.height);


      await page.render({
        canvasContext: context,
        viewport: viewport
      }).promise;


      const result =
        await Tesseract.recognize(
          canvas,
          "eng"
        );


      return result.data.text || "";

    })();


    const timeoutPromise =
      new Promise((_, reject) => {

        setTimeout(() => {

          reject(
            new Error(
              "OCR timed out after 30 seconds."
            )
          );

        }, OCR_TIMEOUT);

      });


    return await Promise.race([
      ocrPromise,
      timeoutPromise
    ]);

  } catch (error) {

    console.warn(
      "OCR unavailable or timed out:",
      file.name,
      error
    );


    return "";

  }

}


/* =========================================================
   CASELINES MAPPING
========================================================= */

function getCaseLinesSection(courtOnlineType) {

  /*
    LEVEL 1:
    Explicit mapping wins.
  */

  if (
    courtOnlineType &&
    caseLinesMapping[courtOnlineType]
  ) {

    return {

      section:
        caseLinesMapping[courtOnlineType],

      status:
        "Confirmed"

    };

  }


  /*
    LEVEL 2:
    Supplied ambiguous/common mappings.
  */

  if (
    courtOnlineType &&
    suppliedCaseLinesMapping[courtOnlineType]
  ) {

    return {

      section:
        suppliedCaseLinesMapping[courtOnlineType],

      status:
        "Provisional - Review Required"

    };

  }


  /*
    LEVEL 3:
    Provisional reasoning.
  */

  const provisional =
    findProvisionalCaseLinesSection(
      courtOnlineType
    );


  if (provisional) {

    return {

      section:
        provisional,

      status:
        "Provisional - Review Required"

    };

  }


  /*
    LEVEL 4:
    Nothing sensible found.
  */

  return {

    section:
      "048 - Any other interlocutory Application",

    status:
      "Provisional - Review Required"

  };

}


/* =========================================================
   PROVISIONAL MAPPING
========================================================= */

function findProvisionalCaseLinesSection(
  courtOnlineType
) {

  const type =
    normaliseText(courtOnlineType);


  if (!type) {

    return "048 - Any other interlocutory Application";

  }


  /*
    Applications
  */

  if (
    type.includes("application")
  ) {

    return "048 - Any other interlocutory Application";

  }


  /*
    Affidavits
  */

  if (
    type.includes("affidavit")
  ) {

    return "001 - Notice of Motion with Founding Affidavit";

  }


  /*
    Reports
  */

  if (
    type.includes("report")
  ) {

    return "033 - Expert Reports";

  }


  /*
    Notices
  */

  if (
    type.includes("notice")
  ) {

    return "044 - Notice of Set-Down";

  }


  return "048 - Any other interlocutory Application";

}


/* =========================================================
   DISPLAY SELECTED FILES
========================================================= */

fileUpload.addEventListener(
  "change",
  function () {

    fileList.innerHTML = "";
    results.innerHTML = "";


    const files =
      fileUpload.files;


    if (
      files &&
      files.length > 0
    ) {

      processButton.disabled =
        false;


      processButton.textContent =
        "Process Documents";


      fileCount.textContent =
        files.length +
        " document(s) ready to process";

    } else {

      processButton.disabled =
        true;


      fileCount.textContent =
        "";

    }


    for (
      let i = 0;
      i < files.length;
      i++
    ) {

      const file =
        document.createElement("div");


      file.className =
        "file";


      file.textContent =
        "📄 " + files[i].name;


      fileList.appendChild(file);

    }

  }
);


/* =========================================================
   PROCESS DOCUMENTS
========================================================= */

processButton.addEventListener(
  "click",
  async function () {

    const files =
      fileUpload.files;


    if (
      !files ||
      files.length === 0
    ) {

      return;

    }


    processButton.disabled =
      true;


    processButton.textContent =
      "Processing Documents...";


    results.innerHTML =
      "<h2>Processing Results</h2>";


    /*
      Convert FileList into an ordinary array.
    */

    const documents =
      Array.from(files);


    /*
      Process every PDF independently.
      A failure in one PDF cannot stop the loop.
    */

    const processedDocuments = [];


    for (
      let i = 0;
      i < documents.length;
      i++
    ) {

      const file =
        documents[i];


      fileCount.textContent =
        `Processing document ${i + 1} of ${documents.length}...`;


      /*
        Temporary progress message.
      */

      const processingMessage =
        document.createElement("div");


      processingMessage.className =
        "processing";


      processingMessage.textContent =
        `Processing document ${i + 1} of ${documents.length}: ${file.name}`;


      results.appendChild(
        processingMessage
      );


      let firstPageText = "";


      let extractionMethod =
        "PDF text";


      try {

        /*
          STEP 1:
          Normal PDF text extraction.
        */

        firstPageText =
          await readFirstPage(file);


        /*
          STEP 2:
          OCR only if necessary.
        */

        if (
          !firstPageText ||
          firstPageText.trim().length < 10
        ) {

          extractionMethod =
            "OCR";


          firstPageText =
            await readFirstPageWithOCR(file);

        }


        /*
          STEP 3:
          Identify Court Online type.

          The function first looks specifically
          between the tramlines.
        */

        const identifiedAs =
          identifyCourtOnlineType(
            firstPageText
          );


        /*
          STEP 4:
          Extract filing date.
        */

        const filingInfo =
          extractFilingDate(
            firstPageText
          );


        /*
          STEP 5:
          Mapping hierarchy:

          1. Explicit
          2. Supplied ambiguous
          3. Provisional
        */

        const mapping =
          getCaseLinesSection(
            identifiedAs
          );


        processedDocuments.push({

          file:
            file,

          originalName:
            file.name,

          firstPageText:
            firstPageText,

          identifiedAs:
            identifiedAs,

          filingInfo:
            filingInfo,

          mapping:
            mapping,

          extractionMethod:
            extractionMethod

        });


        /*
          Remove temporary processing message.
        */

        processingMessage.remove();

      } catch (error) {

        console.error(
          "Document processing error:",
          file.name,
          error
        );


        /*
          IMPORTANT:
          Do not allow one PDF to stop
          the entire batch.
        */

        processedDocuments.push({

          file:
            file,

          originalName:
            file.name,

          firstPageText:
            "",

          identifiedAs:
            null,

          filingInfo:
            null,

          mapping: {

            section:
              "048 - Any other interlocutory Application",

            status:
              "Review Required"

          },

          extractionMethod:
            "Failed",

          error:
            error.message

        });


        processingMessage.remove();

      }

    }


    /* =====================================================
       SORT BY FILING DATE — OLDEST TO NEWEST
    ===================================================== */

    processedDocuments.sort(
      function (a, b) {

        /*
          Documents without a date go last.
        */

        if (
          !a.filingInfo &&
          !b.filingInfo
        ) {

          return 0;

        }


        if (
          !a.filingInfo
        ) {

          return 1;

        }


        if (
          !b.filingInfo
        ) {

          return -1;

        }


        const dateA =
          new Date(
            `${a.filingInfo.date}T${
              a.filingInfo.time || "00:00"
            }`
          );


        const dateB =
          new Date(
            `${b.filingInfo.date}T${
              b.filingInfo.time || "00:00"
            }`
          );


        return dateA - dateB;

      }
    );


    /* =====================================================
       DISPLAY FINAL RESULTS
    ===================================================== */

    results.innerHTML =
      "<h2>Processing Results</h2>";


    /*
      Only display actual processed documents.
    */

    for (
      let i = 0;
      i < processedDocuments.length;
      i++
    ) {

      const doc =
        processedDocuments[i];


      const item =
        document.createElement("div");


      item.className =
        "result-item";


      let statusClass =
        "confirmed";


      if (
        doc.mapping.status
          .toLowerCase()
          .includes("provisional")
      ) {

        statusClass =
          "provisional";

      }


      item.innerHTML = `

        <div class="result-name">
          ${escapeHtml(doc.originalName)}
        </div>

        <div class="result-status">

          <strong>Identified as:</strong>

          ${
            doc.identifiedAs
              ? escapeHtml(doc.identifiedAs)
              : '<span class="warning">⚠ Document type not identified</span>'
          }

          <br><br>

          <strong>Filing date:</strong>

          ${
            doc.filingInfo
              ? escapeHtml(doc.filingInfo.date)
              : '<span class="warning">⚠ Date not found</span>'
          }

          <br>

          <strong>Filing time:</strong>

          ${
            doc.filingInfo
              ? escapeHtml(
                  doc.filingInfo.time || "Not found"
                )
              : "Not found"
          }

          <br><br>

          <strong>CaseLines section:</strong>

          <br>

          ${escapeHtml(
            doc.mapping.section
          )}

          <br><br>

          <strong>Status:</strong>

          <span class="${statusClass}">
            ${escapeHtml(
              doc.mapping.status
            )}
          </span>

          ${
            doc.error
              ? `
                <br><br>

                <span class="warning">
                  ⚠ Processing warning:
                  ${escapeHtml(doc.error)}
                </span>
              `
              : ""
          }

        </div>

      `;


      results.appendChild(item);

    }


    /* =====================================================
       FINAL STATUS
    ===================================================== */

    const missingDates =
      processedDocuments.filter(
        doc => !doc.filingInfo
      ).length;


    const missingTypes =
      processedDocuments.filter(
        doc => !doc.identifiedAs
      ).length;


    processButton.textContent =
      "Documents Processed";


    fileCount.textContent =
      `${processedDocuments.length} document(s) processed and sorted oldest to newest.`;


    if (
      missingDates > 0
    ) {

      fileCount.textContent +=
        ` ⚠ ${missingDates} document(s) require date review.`;

    }


    if (
      missingTypes > 0
    ) {

      fileCount.textContent +=
        ` ⚠ ${missingTypes} document(s) require document-type review.`;

    }

  }
);


/* =========================================================
   SAFE HTML OUTPUT
========================================================= */

function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}
