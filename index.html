<button id="process-button" class="process-button" disabled>

 <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

const fileUpload = document.getElementById("file-upload");
const fileList = document.getElementById("file-list");
const processButton = document.getElementById("process-button");
const fileCount = document.getElementById("file-count");
const results = document.getElementById("results");


/* --------------------------------------------------
   DISPLAY SELECTED FILES
-------------------------------------------------- */

fileUpload.addEventListener("change", function () {

  fileList.innerHTML = "";
  results.innerHTML = "";

  const files = fileUpload.files;

  if (files.length > 0) {

    processButton.disabled = false;

    fileCount.textContent =
      files.length + " document(s) ready to process";

  } else {

    processButton.disabled = true;
    fileCount.textContent = "";

  }


  for (let i = 0; i < files.length; i++) {

    const file = document.createElement("div");

    file.className = "file";

    file.textContent = "📄 " + files[i].name;

    fileList.appendChild(file);

  }

});


/* --------------------------------------------------
   READ TEXT FROM A NORMAL PDF
-------------------------------------------------- */

async function readFirstPage(file) {

  try {

    const arrayBuffer = await file.arrayBuffer();

    const pdf = await pdfjsLib.getDocument({
      data: arrayBuffer
    }).promise;

    const page = await pdf.getPage(1);

    const textContent = await page.getTextContent();

    const text = textContent.items
      .map(item => item.str)
      .join(" ");

    return text;

  } catch (error) {

    console.error("PDF text extraction error:", error);

    return "";

  }

}


/* --------------------------------------------------
   OCR FALLBACK FOR SCANNED PDFs
-------------------------------------------------- */

async function readFirstPageWithOCR(file) {

  try {

    const arrayBuffer = await file.arrayBuffer();

    const pdf = await pdfjsLib.getDocument({
      data: arrayBuffer
    }).promise;

    const page = await pdf.getPage(1);

    const viewport = page.getViewport({
      scale: 2
    });

    const canvas = document.createElement("canvas");

    const context = canvas.getContext("2d");

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({
      canvasContext: context,
      viewport: viewport
    }).promise;


    const result = await Tesseract.recognize(
      canvas,
      "eng"
    );

    return result.data.text;

  } catch (error) {

    console.error("OCR error:", error);

    return "";

  }

}


/* --------------------------------------------------
   PROCESS DOCUMENTS
-------------------------------------------------- */

processButton.addEventListener("click", async function () {

  const files = fileUpload.files;

  if (!files || files.length === 0) {

    return;

  }

  processButton.textContent = "Processing Documents...";
  processButton.disabled = true;

  results.innerHTML = "<h2>Processing Results</h2>";


  for (let i = 0; i < files.length; i++) {

    const originalName = files[i].name;


    /* Try normal PDF text extraction first */

    let firstPageText =
      await readFirstPage(files[i]);


    /* If the PDF has no usable text,
       use OCR instead */

    if (
      !firstPageText ||
      firstPageText.trim().length < 10
    ) {

      firstPageText =
        await readFirstPageWithOCR(files[i]);

    }

/* Normalise text for comparison */

function normaliseText(value) {

  return value
    .toLowerCase()
    .replace(/[’‘]/g, "'")
    .replace(/[–—-]/g, " ")
    .replace(/\s+/g, " ")
    .trim();

}


/* Find a Court Online document type */

function identifyCourtOnlineType(firstPageText) {

  const normalisedText =
    normaliseText(firstPageText);


  /*
    Longest names are checked first.
    This prevents "Affidavit" from being
    selected before "Founding Affidavit",
    for example.
  */

  const sortedTypes =
    [...courtOnlineTypes].sort(
      (a, b) => b.length - a.length
    );


  for (const documentType of sortedTypes) {

    const normalisedType =
      normaliseText(documentType);


    if (
      normalisedText.includes(normalisedType)
    ) {

      return documentType;

    }

  }


  return null;

}


/* Identify the Court Online document type */

const identifiedAs =
  identifyCourtOnlineType(firstPageText);

          .substring(0, 500)
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")}
