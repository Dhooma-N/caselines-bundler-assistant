<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CourtLine Bundler</title>

  <style>
   .process-button {
  margin-top: 30px;
  padding: 16px 32px;
  background: #2f3720;
  color: white;
  border: none;
  border-radius: 6px;
  font-family: "Century Gothic", CenturyGothic, sans-serif;
  font-size: 16px;
  cursor: pointer;
}

.process-button:disabled {
  background: #666269;
  cursor: not-allowed;
  opacity: 0.6;
} 
    body {
      margin: 0;
      font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
      background: #ffffff;
      color: #2f3720;
    }

    header {
      padding: 25px 40px;
      border-bottom: 1px solid #d8d5d0;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .tagline {
      color: #666269;
      margin-top: 8px;
    }

    main {
      max-width: 900px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
    }

    .upload-box {
      margin-top: 35px;
      padding: 60px 30px;
      border: 2px dashed #2f3720;
      border-radius: 12px;
      background: #d8d5d0;
    }

    .upload-box h2 {
      margin-top: 0;
    }

    input[type="file"] {
      display: none;
    }

    .upload-button {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 28px;
      background: #2f3720;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }

    .privacy {
      margin-top: 20px;
      color: #666269;
      font-size: 14px;
    }

    #file-list {
      margin-top: 30px;
      text-align: left;
    }

    .file {
      padding: 12px;
      margin-top: 8px;
      border-bottom: 1px solid #d8d5d0;
    }

    .counter {
      margin-top: 70px;
      padding: 30px;
      background: #d8d5d0;
      border-radius: 12px;
    }

    .counter-number {
      font-size: 40px;
      font-weight: bold;
    }
    .results {
  margin-top: 40px;
  text-align: left;
}

.results h2 {
  text-align: center;
}

.result-item {
  padding: 18px;
  margin-top: 10px;
  border: 1px solid #d8d5d0;
  border-radius: 8px;
  background: white;
}

.result-name {
  font-weight: bold;
  color: #2f3720;
}

.result-status {
  margin-top: 6px;
  color: #666269;
  font-size: 14px;
}
  </style>
</head>

<body>

  <header>
    <h1>CourtLine Bundler</h1>
    <p class="tagline">
      Preparing Court Online documents for CaseLines.
    </p>
  </header>

  <main>

    <h2>Upload your Court Online documents</h2>

    <p>
      Select all of the PDF documents you downloaded from Court Online.
    </p>

    <div class="upload-box">

      <h2>Drag and drop your PDFs here</h2>

      <p>or</p>

      <label for="file-upload" class="upload-button">
        Select Multiple PDF Files
      </label>

      <input
        id="file-upload"
        type="file"
        multiple
        accept=".pdf"
      >

    </div>

    <div id="file-list"></div>
<button id="process-button" class="process-button" disabled>
  Process Documents
</button>

<p id="file-count"></p>
    <div id="results"></div>
    <p class="privacy">
      No login required • Your documents are not permanently retained
    </p>

    <div class="counter">

      <div class="counter-number">0</div>

      <p>Bundles Prepared</p>

    </div>

  </main>

 <script>

  const fileUpload = document.getElementById("file-upload");
  const fileList = document.getElementById("file-list");
  const processButton = document.getElementById("process-button");
  const fileCount = document.getElementById("file-count");

  fileUpload.addEventListener("change", function () {

    fileList.innerHTML = "";

    const files = fileUpload.files;

    if (files.length > 0) {
      processButton.disabled = false;

      fileCount.textContent =
        files.length + " document(s) ready to process";
    } else {
      processButton.disabled = true;
      fileCount.textContent = "";
    }

    for (let i = 0; i < files.length; i++) {

      const file = document.createElement("div");

      file.className = "file";

      file.textContent =
        "📄 " + files[i].name;

      fileList.appendChild(file);

    }

  });

const results = document.getElementById("results");

processButton.addEventListener("click", function () {

  const files = fileUpload.files;

  processButton.textContent = "Processing Documents...";
  processButton.disabled = true;

  results.innerHTML = "<h2>Processing Results</h2>";

  for (let i = 0; i < files.length; i++) {

    const originalName = files[i].name;

    // Temporary identification system.
    // This will later be replaced with PDF first-page reading.
    let identifiedAs = "Review Required";

    const name = originalName.toLowerCase();

    if (name.includes("summons")) {
      identifiedAs = "Summons";
    }
    else if (name.includes("founding")) {
      identifiedAs = "Founding Affidavit";
    }
    else if (name.includes("answering")) {
      identifiedAs = "Answering Affidavit";
    }
    else if (name.includes("replying")) {
      identifiedAs = "Replying Affidavit";
    }
    else if (name.includes("notice")) {
      identifiedAs = "Notice";
    }
    else if (name.includes("heads")) {
      identifiedAs = "Heads of Argument";
    }
    else if (name.includes("plea")) {
      identifiedAs = "Plea";
    }

    const item = document.createElement("div");

    item.className = "result-item";

    item.innerHTML = `
      <div class="result-name">
        ${originalName}
      </div>

      <div class="result-status">
        Identified as: <strong>${identifiedAs}</strong>
      </div>
    `;

    results.appendChild(item);

  }

  processButton.textContent = "Documents Processed";

  fileCount.textContent =
    files.length + " document(s) processed. Please review the results.";

});

</script>
</body>
</html>
